<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Examen Ghibli - DAW</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        img { width: 100px; }
        .seccio { margin-bottom: 30px; border-bottom: 1px solid #ccc; padding-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Gestió de dades Estudi Ghibli</h1>

    <!-- Apartat 1 -->
    <div class="seccio">
        <h2>Apartat 1: Llistar Pel·lícules</h2>
        <button id="btn-llistar">Llistar Pel·lícules</button>
        <p id="total-pelis"></p>
        <div id="taula-pelis"></div>
    </div>

    <!-- Apartat 2 -->
    <div class="seccio">
        <h2>Apartat 2: Cercar per ID</h2>
        <select id="selector-id">
            <option value="">Tria una pel·lícula...</option>
        </select>
        <div id="detall-peli">
            <p id="descripcio-peli"></p>
            <ul id="personatges-peli"></ul>
        </div>
    </div>

    <!-- Apartat 3 -->
    <div class="seccio">
        <h2>Apartat 3: Localitzacions</h2>
        <button id="btn-locs">Mostrar Localitzacions</button>
        <div id="taula-locs"></div>
    </div>

    <!-- Apartat 4 -->
    <div class="seccio">
        <h2>Apartat 4: 5 Personatges Aleatoris</h2>
        <button id="btn-random">Generar 5 Aleatoris</button>
        <div id="taula-random"></div>
    </div>

    <!-- Apartat 5 -->
    <div class="seccio">
        <h2>Apartat 5: Comptar Espècies</h2>
        <button id="btn-especies">Comptar Espècies</button>
        <div id="llista-especies"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
